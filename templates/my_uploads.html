<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Uploads · UniVault</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/static/css/atlas-pages.css"></head><body class="atlas-subpage atlas-uploads-page min-h-screen bg-slate-50"><main class="mx-auto max-w-5xl p-6 sm:p-10"><a href="/" class="font-bold text-indigo-600">← UniVault</a><h1 class="mt-6 text-3xl font-bold">My Uploads</h1><div class="mt-6 space-y-3">{% for item in uploads %}<article class="rounded-xl bg-white p-4 shadow-sm"><h2 class="font-bold">{{ item.title }}</h2><p class="text-sm text-slate-500">{{ item.subject_name }} · {{ item.status }} · {{ item.created_at }}</p></article>{% else %}<p class="mt-8 text-slate-500">You haven't uploaded materials yet.</p>{% endfor %}</div></main></body></html>
