<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>Create account · UniVault</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/static/css/custom.css"><link rel="stylesheet" href="/static/css/atlas-pages.css"></head>
<body class="atlas-subpage atlas-register-page min-h-screen bg-mesh-gradient flex items-center justify-center p-5"><main class="auth-shell register-shell w-full max-w-lg rounded-3xl border border-slate-200 bg-white/90 p-7 shadow-2xl backdrop-blur sm:p-10"><a href="/" class="font-extrabold text-indigo-600">🎓 UniVault</a><p class="mt-8 text-xs font-bold tracking-[.2em] text-indigo-600">JOIN THE COMMUNITY</p><h1 class="mt-2 text-3xl font-extrabold text-slate-900">Create your account</h1><p class="mt-2 text-slate-500">Every new account starts with student access.</p>
{% if error %}<div role="alert" class="mt-5 rounded-xl bg-rose-50 p-3 text-sm text-rose-700">{{ error }}</div>{% endif %}
<form id="registerForm" method="post" class="mt-6 space-y-4"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div><label for="name" class="mb-1 block text-sm font-semibold text-slate-700">Name</label><input id="name" name="name" autocomplete="name" required maxlength="80" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"></div><div><label for="username" class="mb-1 block text-sm font-semibold text-slate-700">Username</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]+" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"></div>
<div><label for="password" class="mb-1 block text-sm font-semibold text-slate-700">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="10" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"><p class="mt-1 text-xs text-slate-500">At least 10 characters, including a letter and a number.</p></div>
<div><label for="confirm_password" class="mb-1 block text-sm font-semibold text-slate-700">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"></div>
<button class="w-full rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-4 py-3 font-bold text-white hover:from-indigo-700 hover:to-violet-700 focus:outline-none focus:ring-2 focus:ring-indigo-400">Create student account</button></form><p class="mt-5 text-center text-sm text-slate-500">Already registered? <a href="/login" class="font-bold text-indigo-600">Sign in</a></p><a href="/" class="mt-5 block text-center text-sm text-slate-500 hover:text-indigo-600">Continue browsing as guest</a></main>
<script>document.getElementById('registerForm').addEventListener('submit',e=>{if(document.getElementById('password').value!==document.getElementById('confirm_password').value){e.preventDefault();alert('Passwords do not match.')}});</script></body></html>
