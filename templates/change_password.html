<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>Change password · UniVault</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="/static/css/atlas-pages.css"></head><body class="atlas-subpage atlas-password-page min-h-screen bg-slate-950 text-white flex items-center justify-center p-5"><main class="auth-shell w-full max-w-lg rounded-3xl border border-slate-700 bg-slate-900 p-8"><a href="/" class="font-bold text-indigo-300">🎓 UniVault</a><h1 class="mt-7 text-3xl font-bold">Change your password</h1><p class="mt-2 text-slate-400">Choose a new password to secure your account.</p>{% if user.must_change_password %}<p class="mt-4 rounded-xl bg-amber-400/10 p-3 text-sm text-amber-200">Change your initial password before using administrator features.</p>{% endif %}{% if error %}<p role="alert" class="mt-4 text-sm text-rose-300">{{ error }}</p>{% endif %}<form method="post" class="mt-6 space-y-4"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="block text-sm">Current password<input required name="current_password" type="password" maxlength="1024" autocomplete="current-password" class="mt-1 w-full rounded-xl bg-slate-950 p-3"></label><label class="block text-sm">New password<input required name="new_password" type="password" minlength="10" maxlength="1024" autocomplete="new-password" class="mt-1 w-full rounded-xl bg-slate-950 p-3"><span class="text-xs text-slate-400">10+ characters, with a letter and a number.</span></label><label class="block text-sm">Confirm new password<input required name="confirm_password" type="password" maxlength="1024" autocomplete="new-password" class="mt-1 w-full rounded-xl bg-slate-950 p-3"></label><button class="w-full rounded-xl bg-indigo-500 p-3 font-bold">Update password</button></form></main></body></html>
